# Uses a prebuilt public image; source builds remain in compose.yaml.
services:
  filebrowser:
    image: "toolslib/filebrowser3:${FILEBROWSER_VERSION:-1.0.0-rc.1}"
    user: "1000:1000"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "127.0.0.1:${FB_HTTP_PORT:-8000}:8080"
    environment:
      FB_USERNAME: "${FB_USERNAME:-admin}"
      FB_DISABLE_EXEC: "true"
      FB_CACHE_DIR: /cache
      FB_IMAGE_PROCESSORS: "1"
    volumes:
      - served-files:/srv
      - application-config:/config
      - application-database:/database
      - preview-cache:/cache
    secrets:
      - filebrowser_password_hash
    networks:
      web:
networks:
  web:
volumes:
  served-files:
  application-config:
  application-database:
  preview-cache:
secrets:
  filebrowser_password_hash:
    file: ./secrets/filebrowser_password_hash
