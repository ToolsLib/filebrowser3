name: Vulnerability checks (optional)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vulnerabilities-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
jobs:
  security-go:
    name: Go vulnerability scan (optional, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...
  security-frontend:
    name: Frontend dependency audit (optional)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
      - name: Install integrity-pinned pnpm without Corepack
        run: |
          pnpm_prefix="$RUNNER_TEMP/filebrowser3-pnpm"
          npm --prefix frontend run setup:pnpm -- --prefix "$pnpm_prefix"
          echo "$pnpm_prefix/bin" >> "$GITHUB_PATH"
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm audit
